[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpost"
version = "0.1.0"
description = "Draft founder posts where every claim is traced to evidence, then verify the draft before a human publishes it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
proofpost = "proofpost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.setuptools.package-data]
proofpost = ["static/*.html"]
